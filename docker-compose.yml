# Local/production-like stack: Postgres + migrations + web + worker.
#   cp .env.example .env   # fill in secrets
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadfinder
      POSTGRES_PASSWORD: leadfinder
      POSTGRES_DB: leadfinder
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadfinder"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["pnpm", "db:migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://leadfinder:leadfinder@db:5432/leadfinder
    depends_on:
      db: { condition: service_healthy }

  web:
    build: .
    command: ["pnpm", "start"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://leadfinder:leadfinder@db:5432/leadfinder
      EXPORT_STORAGE_DIR: /app/storage/exports
    ports: ["3000:3000"]
    volumes: [exports:/app/storage/exports]
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: .
    command: ["pnpm", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://leadfinder:leadfinder@db:5432/leadfinder
      EXPORT_STORAGE_DIR: /app/storage/exports
    volumes: [exports:/app/storage/exports]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
  exports:
